
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой трекер задач</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f8;
      color: #25263a;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #20204012;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #777b90;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #dddfea;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      font-size: 15px;
    }

    .add-button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #6657e8;
      color: white;
    }

    .counter {
      margin-bottom: 12px;
      color: #6657e8;
      font-size: 14px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eeeef4;
    }

    li:last-child {
      border-bottom: none;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6657e8;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li.completed .task-text {
      text-decoration: line-through;
      color: #999daf;
    }

    .delete-button {
      border: none;
      background: transparent;
      color: #999daf;
      font-size: 22px;
    }

    .delete-button:hover {
      color: #e04455;
    }

    .empty {
      padding: 24px 0;
      text-align: center;
      color: #999daf;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .app {
        padding: 20px;
      }

      form {
        flex-direction: column;
      }

      .add-button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Мои задачи ✨</h1>
    <p class="subtitle">Записывай дела и двигайся к цели.</p>

    <form id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Например, изучить HTML"
        maxlength="200"
        aria-label="Новая задача"
        required
      >
      <button class="add-button" type="submit">+ Добавить</button>
    </form>

    <div class="counter" id="counter" aria-live="polite">
      Осталось задач: 0
    </div>

    <ul id="taskList"></ul>

    <p class="empty" id="emptyMessage">
      Пока задач нет. Добавь первую!
    </p>
  </main>

  <script>
    // Находим элементы страницы
    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");
    const counter = document.querySelector("#counter");
    const emptyMessage = document.querySelector("#emptyMessage");

    // Загружаем задачи из браузера
    function loadTasks() {
      try {
        const saved = localStorage.getItem("my-tasks");
        const parsed = saved ? JSON.parse(saved) : [];

        if (
          !Array.isArray(parsed) ||
          !parsed.every(task =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          )
        ) {
          return [];
        }

        return parsed;
      } catch (error) {
        console.error("Ошибка загрузки:", error);
        return [];
      }
    }

    let tasks = loadTasks();

    // Сохраняем задачи
    function saveTasks() {
      try {
        localStorage.setItem("my-tasks", JSON.stringify(tasks));
      } catch (error) {
        console.error("Ошибка сохранения:", error);
      }
    }

    // Добавляем задачу кнопкой или Enter
    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      tasks.push({
        id: crypto.randomUUID(),
        text: text,
        completed: false
      });

      saveTasks();
      renderTasks();

      input.value = "";
      input.focus();
    });

    // Отмечаем задачу выполненной
    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return { ...task, completed: !task.completed };
        }
        return task;
      });

      saveTasks();
      renderTasks();
    }

    // Удаляем задачу
    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    }

    // Создаём элемент задачи
    function createTask(task) {
      const item = document.createElement("li");

      if (task.completed) {
        item.classList.add("completed");
      }

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.completed;
      checkbox.setAttribute("aria-label", "Выполнено");

      checkbox.addEventListener("change", function() {
        toggleTask(task.id);
      });

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "×";
      deleteButton.setAttribute("aria-label", "Удалить задачу");

      deleteButton.addEventListener("click", function() {
        deleteTask(task.id);
      });

      item.append(checkbox, text, deleteButton);

      return item;
    }

    // Обновляем список и счётчик
    function renderTasks() {
      list.replaceChildren();

      tasks.forEach(task => {
        list.append(createTask(task));
      });

      const remaining = tasks.filter(task => !task.completed).length;

      counter.textContent = "Осталось задач: " + remaining;
      emptyMessage.hidden = tasks.length > 0;
    }

    // Показываем задачи при запуске
    renderTasks();
  </script>
</body>
</html>
