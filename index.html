
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой трекер задач</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #20243a;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(30, 40, 80, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #777e91;
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #dfe3ed;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #6258e8;
      box-shadow: 0 0 0 3px rgba(98, 88, 232, 0.12);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-button {
      background: #6258e8;
      color: white;
    }

    .add-button:hover {
      background: #5046d2;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #edf0f5;
    }

    .filter-button {
      flex: 1;
      padding: 10px 8px;
      background: #f3f4f8;
      color: #62697c;
    }

    .filter-button.active {
      background: #6258e8;
      color: white;
    }

    #taskList {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: #6258e8;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .task.completed .task-text {
      color: #969bad;
      text-decoration: line-through;
    }

    .delete-button {
      flex-shrink: 0;
      padding: 8px 10px;
      background: #fff0f0;
      color: #d44747;
    }

    .delete-button:hover {
      background: #ffdddd;
    }

    .empty-message {
      padding: 24px 8px;
      color: #8b91a3;
      text-align: center;
      line-height: 1.5;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      color: #777e91;
      font-size: 14px;
    }

    #counter {
      line-height: 1.5;
    }

    .clear-button {
      padding: 8px 10px;
      background: transparent;
      color: #6258e8;
    }

    .clear-button:hover {
      background: #f3f1ff;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #6258e8;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 10px;
      }

      .container {
        padding: 20px 16px;
        border-radius: 16px;
      }

      h1 {
        font-size: 25px;
      }

      form {
        flex-direction: column;
      }

      .add-button {
        width: 100%;
      }

      .filters {
        gap: 5px;
      }

      .filter-button {
        padding: 10px 4px;
        font-size: 12px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Мой трекер задач</h1>
    <p class="subtitle">Маленькие шаги ведут к большим результатам.</p>

    <form id="taskForm">
      <input
        id="taskInput"
        type="text"
        placeholder="Например, изучить JavaScript"
        maxlength="500"
        autocomplete="off"
        aria-label="Новая задача"
      >
      <button class="add-button" type="submit">+ Добавить</button>
    </form>

    <div class="filters" aria-label="Фильтры задач">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">Все</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Активные</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty-message">Пока нет задач. Добавь свою первую!</p>

    <div class="footer">
      <span id="counter">Осталось задач: 0</span>
      <button id="clearCompleted" class="clear-button" type="button">Удалить выполненные</button>
    </div>
  </main>

  <script>
    // Находим элементы страницы.
    const taskForm = document.querySelector("#taskForm");
    const taskInput = document.querySelector("#taskInput");
    const taskList = document.querySelector("#taskList");
    const counter = document.querySelector("#counter");
    const emptyMessage = document.querySelector("#emptyMessage");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const clearCompletedButton = document.querySelector("#clearCompleted");

    // Загружаем задачи из памяти браузера.
    function loadTasks() {
      try {
        const saved = localStorage.getItem("my-tasks");
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) return [];

        return parsed.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.text === "string" &&
          typeof task.completed === "boolean"
        );
      } catch (error) {
        console.error("Ошибка загрузки задач:", error);
        return [];
      }
    }

    let tasks = loadTasks();
    let currentFilter = "all";

    // Сохраняем задачи.
    function saveTasks() {
      try {
        localStorage.setItem("my-tasks", JSON.stringify(tasks));
      } catch (error) {
        console.error("Ошибка сохранения задач:", error);
        alert("Не удалось сохранить задачи. Проверь настройки браузера.");
      }
    }

    // Создаём уникальный идентификатор задачи.
    function createId() {
      if (window.crypto && window.crypto.randomUUID) {
        return window.crypto.randomUUID();
      }

      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    // Добавляем новую задачу.
    function addTask(text) {
      const cleanText = text.trim();

      if (!cleanText) return;

      tasks.push({
        id: createId(),
        text: cleanText,
        completed: false
      });

      saveTasks();
      renderTasks();
    }

    // Меняем статус задачи.
    function toggleTask(id) {
      tasks = tasks.map(task =>
        task.id === id
          ? { ...task, completed: !task.completed }
          : task
      );

      saveTasks();
      renderTasks();
    }

    // Удаляем задачу.
    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);

      saveTasks();
      renderTasks();
    }

    // Создаём безопасный элемент задачи.
    function createTaskElement(task) {
      const li = document.createElement("li");
      li.className = "task";
      li.classList.toggle("completed", task.completed);

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "task-checkbox";
      checkbox.checked = task.completed;
      checkbox.setAttribute("aria-label", "Отметить задачу выполненной");
      checkbox.addEventListener("change", () => toggleTask(task.id));

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Удалить";
      deleteButton.setAttribute("aria-label", "Удалить задачу: " + task.text);
      deleteButton.addEventListener("click", () => deleteTask(task.id));

      li.append(checkbox, text, deleteButton);

      return li;
    }

    // Показываем задачи с учётом выбранного фильтра.
    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      visibleTasks.forEach(task => {
        taskList.appendChild(createTaskElement(task));
      });

      const remaining = tasks.filter(task => !task.completed).length;
      const word = remaining === 1 ? "задача" :
        remaining >= 2 && remaining <= 4 ? "задачи" : "задач";

      counter.textContent = "Осталось задач: " + remaining + " " + word;

      emptyMessage.hidden = visibleTasks.length > 0;

      if (visibleTasks.length === 0) {
        if (tasks.length === 0) {
          emptyMessage.textContent = "Пока нет задач. Добавь свою первую!";
        } else if (currentFilter === "active") {
          emptyMessage.textContent = "Нет активных задач.";
        } else if (currentFilter === "completed") {
          emptyMessage.textContent = "Пока нет выполненных задач.";
        } else {
          emptyMessage.textContent = "Задач пока нет.";
        }
      }

      filterButtons.forEach(button => {
        const selected = button.dataset.filter === currentFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    // Обрабатываем отправку формы, в том числе клавишей Enter.
    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      addTask(taskInput.value);
      taskInput.value = "";
      taskInput.focus();
    });

    // Переключаем фильтр.
    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        renderTasks();
      });
    });

    // Удаляем все выполненные задачи.
    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    // Показываем сохранённые задачи при открытии страницы.
    renderTasks();
  </script>
</body>
</html>
